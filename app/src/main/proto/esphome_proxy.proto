syntax = "proto3";

package com.zen3515.homeassistant_mobile_ble_proxy.proto;

option java_package = "com.zen3515.homeassistant_mobile_ble_proxy.proto";
option java_multiple_files = true;

message HelloRequest {
  string client_info = 1;
  uint32 api_version_major = 2;
  uint32 api_version_minor = 3;
}

message HelloResponse {
  uint32 api_version_major = 1;
  uint32 api_version_minor = 2;
  string server_info = 3;
  string name = 4;
}

message DisconnectRequest {}

message DisconnectResponse {}

message PingRequest {}

message PingResponse {}

message DeviceInfoRequest {}

message DeviceInfoResponse {
  bool uses_password = 1;
  string name = 2;
  string mac_address = 3;
  string esphome_version = 4;
  string compilation_time = 5;
  string model = 6;
  uint32 legacy_bluetooth_proxy_version = 11;
  string manufacturer = 12;
  string friendly_name = 13;
  uint32 bluetooth_proxy_feature_flags = 15;
  string bluetooth_mac_address = 18;
  bool api_encryption_supported = 19;
}

message ListEntitiesRequest {}

message ListEntitiesDoneResponse {}

message SubscribeStatesRequest {}

message SubscribeBluetoothLEAdvertisementsRequest {
  uint32 flags = 1;
}

message BluetoothLERawAdvertisement {
  uint64 address = 1;
  sint32 rssi = 2;
  uint32 address_type = 3;
  bytes data = 4;
}

message BluetoothLERawAdvertisementsResponse {
  repeated BluetoothLERawAdvertisement advertisements = 1;
}

enum BluetoothDeviceRequestType {
  BLUETOOTH_DEVICE_REQUEST_TYPE_CONNECT = 0;
  BLUETOOTH_DEVICE_REQUEST_TYPE_DISCONNECT = 1;
  BLUETOOTH_DEVICE_REQUEST_TYPE_PAIR = 2;
  BLUETOOTH_DEVICE_REQUEST_TYPE_UNPAIR = 3;
  BLUETOOTH_DEVICE_REQUEST_TYPE_CONNECT_V3_WITH_CACHE = 4;
  BLUETOOTH_DEVICE_REQUEST_TYPE_CONNECT_V3_WITHOUT_CACHE = 5;
  BLUETOOTH_DEVICE_REQUEST_TYPE_CLEAR_CACHE = 6;
}

message BluetoothDeviceRequest {
  uint64 address = 1;
  BluetoothDeviceRequestType request_type = 2;
  bool has_address_type = 3;
  uint32 address_type = 4;
}

message BluetoothDeviceConnectionResponse {
  uint64 address = 1;
  bool connected = 2;
  uint32 mtu = 3;
  int32 error = 4;
}

message BluetoothGATTGetServicesRequest {
  uint64 address = 1;
}

message BluetoothGATTReadRequest {
  uint64 address = 1;
  uint32 handle = 2;
}

message BluetoothGATTWriteRequest {
  uint64 address = 1;
  uint32 handle = 2;
  bool response = 3;
  bytes data = 4;
}

message BluetoothGATTReadDescriptorRequest {
  uint64 address = 1;
  uint32 handle = 2;
}

message BluetoothGATTWriteDescriptorRequest {
  uint64 address = 1;
  uint32 handle = 2;
  bytes data = 3;
}

message BluetoothGATTNotifyRequest {
  uint64 address = 1;
  uint32 handle = 2;
  bool enable = 3;
}

message SubscribeBluetoothConnectionsFreeRequest {}

message BluetoothConnectionsFreeResponse {
  uint32 free = 1;
  uint32 limit = 2;
  repeated uint64 allocated = 3;
}

message BluetoothGATTErrorResponse {
  uint64 address = 1;
  uint32 handle = 2;
  int32 error = 3;
}

message UnsubscribeBluetoothLEAdvertisementsRequest {}

enum BluetoothScannerState {
  BLUETOOTH_SCANNER_STATE_IDLE = 0;
  BLUETOOTH_SCANNER_STATE_STARTING = 1;
  BLUETOOTH_SCANNER_STATE_RUNNING = 2;
  BLUETOOTH_SCANNER_STATE_FAILED = 3;
  BLUETOOTH_SCANNER_STATE_STOPPING = 4;
  BLUETOOTH_SCANNER_STATE_STOPPED = 5;
}

enum BluetoothScannerMode {
  BLUETOOTH_SCANNER_MODE_PASSIVE = 0;
  BLUETOOTH_SCANNER_MODE_ACTIVE = 1;
}

message BluetoothScannerStateResponse {
  BluetoothScannerState state = 1;
  BluetoothScannerMode mode = 2;
  BluetoothScannerMode configured_mode = 3;
}

message BluetoothScannerSetModeRequest {
  BluetoothScannerMode mode = 1;
}

message BluetoothSetConnectionParamsRequest {
  uint64 address = 1;
  uint32 min_interval = 2;
  uint32 max_interval = 3;
  uint32 latency = 4;
  uint32 timeout = 5;
}

message BluetoothSetConnectionParamsResponse {
  uint64 address = 1;
  int32 error = 2;
}

message ListEntitiesTextSensorResponse {
  string object_id = 1;
  fixed32 key = 2;
  string name = 3;
  reserved 4;
  string icon = 5;
  bool disabled_by_default = 6;
  uint32 entity_category = 7;
}

message TextSensorStateResponse {
  fixed32 key = 1;
  string state = 2;
  bool missing_state = 3;
}

message SubscribeHomeassistantServicesRequest {}

message HomeassistantServiceMap {
  string key = 1;
  string value = 2;
}

// Named HomeassistantActionRequest in newer ESPHome versions; wire layout unchanged.
message HomeassistantServiceResponse {
  string service = 1;
  repeated HomeassistantServiceMap data = 2;
  repeated HomeassistantServiceMap data_template = 3;
  repeated HomeassistantServiceMap variables = 4;
  bool is_event = 5;
}

enum ServiceArgType {
  SERVICE_ARG_TYPE_BOOL = 0;
  SERVICE_ARG_TYPE_INT = 1;
  SERVICE_ARG_TYPE_FLOAT = 2;
  SERVICE_ARG_TYPE_STRING = 3;
  SERVICE_ARG_TYPE_BOOL_ARRAY = 4;
  SERVICE_ARG_TYPE_INT_ARRAY = 5;
  SERVICE_ARG_TYPE_FLOAT_ARRAY = 6;
  SERVICE_ARG_TYPE_STRING_ARRAY = 7;
}

message ListEntitiesServicesArgument {
  string name = 1;
  ServiceArgType type = 2;
}

message ListEntitiesServicesResponse {
  string name = 1;
  fixed32 key = 2;
  repeated ListEntitiesServicesArgument args = 3;
}

message ExecuteServiceArgument {
  bool bool_ = 1;
  int32 legacy_int = 2;
  float float_ = 3;
  string string_ = 4;
  sint32 int_ = 5;
  repeated bool bool_array = 6;
  repeated sint32 int_array = 7;
  repeated float float_array = 8;
  repeated string string_array = 9;
}

message ExecuteServiceRequest {
  fixed32 key = 1;
  repeated ExecuteServiceArgument args = 2;
}
